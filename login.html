<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Akses - Procurement Policy & Document Center</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-wrapper {
            width: 100%;
            /* Lebar aslinya 400px, sekarang dilebarkan menjadi 550px */
            max-width: 550px; 
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            /* Menambah ruang kosong di kiri-kanan dari 30px menjadi 50px agar isinya tidak terlalu mepet ke pinggir saat dilebarkan */
            padding: 40px 50px; 
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* 1. Memperbesar Logo */
        .logo {
            max-width: 180px; /* Sebelumnya 140px, sekarang diperbesar */
            height: auto;
            margin-bottom: 20px;
        }

        /* 2. Memperbesar Judul dan Teks Deskripsi */
        .login-card h2 {
            color: #333333;
            font-size: 28px; /* Diperbesar dari 24px */
            margin-bottom: 8px;
        }

        .login-card p {
            color: #666666;
            font-size: 16px; /* Diperbesar dari 14px */
            margin-bottom: 35px;
        }

        /* Memastikan seluruh isi input-group rata kiri */
        .input-group {
            text-align: left; 
            margin-bottom: 20px;
            width: 100%;
        }

        /* Mengatur label (Username / Email & Password) */
        .input-group label {
            display: block;
            color: #333333; /* Warna abu-abu gelap agar mudah dibaca */
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Mengatur kotak ketikan (input) */
        .input-group input {
            width: 100%;
            padding: 12px 15px; /* Memberi jarak agar teks/kursor tidak menempel di garis tepi */
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box; /* Sangat penting agar padding tidak merusak ukuran kotak */
            transition: border-color 0.3s ease;
        }

        /* Efek saat kotak diklik (fokus) */
        .input-group input:focus {
            outline: none;
            border-color: #d1121c; /* Warna merah saat aktif */
        }

        /* Mengatur tombol Masuk */
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #d1121c; /* Merah SIG */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px; /* Jarak antara password dan tombol */
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #a80e16;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <!-- Memanggil gambar logo dari dalam folder logo -->
                <img src="./logo/logosig.png" alt="Logo SIG" class="logo">
            </div>
            
            <h2>Login Akses</h2>
            <p>Procurement Policy & Document Center</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username / Email</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
                
                <button type="submit" class="btn-login">Masuk</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Jika sudah login, langsung ke dashboard
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = "dashboard.html";
                return;
            }

            const loginForm = document.getElementById('loginForm');

            loginForm.addEventListener('submit', function(event) {
                event.preventDefault(); // Mencegah halaman refresh otomatis
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                if (username !== '' && password !== '') {
                    // Animasi loading saat tombol ditekan
                    const btn = document.querySelector('.btn-login');
                    btn.innerHTML = "Memproses...";
                    btn.disabled = true;
                    
                    setTimeout(() => {
                        // Simpan sesi login
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('username', username);

                        // Redirect ke dashboard
                        window.location.href = "dashboard.html";
                    }, 1000); // Jeda 1 detik untuk efek loading
                }
            });
        });
    </script>
</body>

</html>
